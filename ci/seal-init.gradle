// Seal CI init script, shared by .travis.yml (tests) and .github/workflows/seal-build.yml (jar).
// Turns off the lint gates (checkstyle, error-prone, nohttp, jacoco reports), caps parallel test
// forks for the 2-CPU CI hosts, prints each test result plus a per-task summary line, and adds
// pkix's CompositeKeyTest (not referenced by any AllTests suite, so the AllTest* filter skips it).
allprojects { p ->
    p.tasks.withType(Checkstyle).configureEach { enabled = false }
    p.tasks.matching { it.name.toLowerCase().contains('nohttp') }.configureEach { enabled = false }
    p.afterEvaluate {
        p.tasks.withType(org.gradle.testing.jacoco.tasks.JacocoReport).configureEach { enabled = false }
        p.tasks.withType(JavaCompile).configureEach { t ->
            def ep = t.options.extensions.findByName('errorprone')
            if (ep != null) {
                ep.enabled = false
            }
        }
        p.tasks.withType(Test).configureEach { t ->
            t.maxParallelForks = 2
            def jc = t.extensions.findByName('jacoco')
            if (jc != null) {
                jc.enabled = false
            }
            t.testLogging {
                showStandardStreams = false
                events 'passed', 'skipped', 'failed'
                exceptionFormat 'full'
            }
            t.afterSuite { desc, result ->
                if (desc.parent == null) {
                    println("TEST SUMMARY ${t.path}: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)")
                }
            }
        }
        if (p.path == ':pkix') {
            p.tasks.named('test').configure { t ->
                t.filter { includeTestsMatching 'org.bouncycastle.openssl.test.CompositeKeyTest' }
            }
        }
    }
}
